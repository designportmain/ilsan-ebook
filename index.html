<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 Edu-Cloud ILSAN · 일산중학교 교육활동 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 페이퍼로지 (Paperlogy) — GitHub Pages 등 실제 배포 환경에서 로드됩니다 */
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}
:root{
  /* 표지에서 뽑은 색 */
  --blue:#2361ac; --blue-d:#1a4a8c; --indigo:#4862ad; --orange:#f39a3a; --orange-l:#f1ab65;
  --teal:#00a8b8; --purple:#8459a1; --lav:#aeb3d9; --mist:#f0f1f9; --cyan:#9fdcec;
  --ink:#121521; --mut:#5d6378; --line:#e6e9f3; --grid:#eef0f6; --bg:#ffffff;
  --display:'Rubik','Paperlogy','IBM Plex Sans KR',system-ui,sans-serif;
  --sans:'Paperlogy','IBM Plex Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{width:min(1240px,100% - 48px);margin:0 auto;position:relative}
.gridbg{background-color:#fff;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}

/* ───── hero ───── */
.hero{position:relative;overflow:hidden;padding:86px 0 150px}
.orb{position:absolute;border-radius:50%;filter:blur(38px);pointer-events:none}
.orb.b{width:420px;height:420px;right:-130px;top:-170px;background:radial-gradient(circle at 40% 60%,#2a4fb0,#5a6fd0 55%,#c3c9f0);opacity:.9}
.orb.o{width:150px;height:150px;right:24%;top:150px;background:radial-gradient(circle,#f39a3a,#f7c088);filter:blur(16px);opacity:.85}
.orb.c{width:300px;height:220px;left:-120px;bottom:40px;background:radial-gradient(circle,#4f8fd8,#9fdcec);opacity:.55}
.waves{position:absolute;left:0;right:0;bottom:0;width:100%;height:190px;pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center;z-index:1}
.deco{position:absolute;pointer-events:none}
.deco.plus{left:-6px;top:-34px;width:34px}
.deco.code{left:46%;top:-30px;width:58px}

.year{display:inline-block;background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(20px,2.2vw,28px);padding:6px 26px;border-radius:99px;letter-spacing:.01em}
.hero h1{margin:16px 0 0;font-family:var(--display);line-height:.98;letter-spacing:-.02em}
.hero h1 .l1{display:block;font-weight:900;font-size:clamp(48px,7.2vw,96px);color:var(--ink)}
.hero h1 .l2{display:block;font-weight:900;font-size:clamp(50px,7.6vw,102px);color:var(--blue);margin-top:4px}
.rule{width:64px;height:2px;background:var(--ink);margin:26px 0 18px}
.hero .sub{font-size:clamp(18px,1.8vw,23px);font-weight:600;margin:0 0 14px}
.hero p{font-size:16px;line-height:1.75;color:var(--mut);max-width:31em;margin:0}
.hero .cta{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:99px;font-weight:700;font-size:15px;transition:.2s}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 10px 24px -10px #2361acaa}
.btn.pri:hover{background:var(--blue-d);transform:translateY(-2px)}
.btn.sec{background:#ffffffcc;border:1px solid var(--line);backdrop-filter:blur(6px)}
.btn.sec:hover{border-color:var(--blue);color:var(--blue)}

/* featured — 카드 덱 */
.feat{position:relative;display:flex;flex-direction:column;align-items:center;min-height:520px;justify-content:flex-end;min-width:0}
.feat .halo{position:absolute;width:86%;aspect-ratio:1;border-radius:50%;bottom:70px;background:radial-gradient(circle at 50% 40%,#ffffff,#eef0fb 60%,#dfe3f6);box-shadow:inset 0 0 0 1px #fff,0 30px 60px -30px #4862ad55}
.deck{position:relative;width:min(290px,64%);aspect-ratio:1/1.396;z-index:1;margin-right:40px}
.dk{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 2px 2px #0001,0 22px 40px -16px #1a2b5c66;
  transition:transform .75s cubic-bezier(.22,.8,.2,1),opacity .6s,filter .6s;will-change:transform}
.dk .cvw{position:absolute;inset:0}
.dk .cvw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.dk::after{content:"";position:absolute;inset:0;z-index:3;background:linear-gradient(120deg,#ffffff38,transparent 45%);pointer-events:none}
.dk[data-p="0"]{transform:none;z-index:4}
.dk[data-p="1"]{transform:translate(34px,-20px) rotate(6deg) scale(.93);z-index:3;filter:brightness(.97) saturate(.85)}
.dk[data-p="2"]{transform:translate(62px,-38px) rotate(12deg) scale(.86);z-index:2;filter:brightness(.94) saturate(.7);opacity:.85}
.dk[data-p="h"]{transform:translate(62px,-38px) rotate(12deg) scale(.82);z-index:1;opacity:0}
.dk.fly{transform:translate(-115%,40px) rotate(-18deg) scale(.95)!important;opacity:0!important;z-index:5!important}
.dk.snap{transition:none!important}
.dk[data-p="0"]:hover{transform:translateY(-8px) rotate(-1.5deg)}
.dk .open{position:absolute;left:50%;bottom:16px;z-index:4;transform:translate(-50%,10px);opacity:0;transition:.3s;background:var(--blue);color:#fff;font-size:13px;font-weight:700;padding:9px 16px;border-radius:99px;white-space:nowrap;box-shadow:0 8px 18px -6px #2361acaa}
.dk[data-p="0"]:hover .open{opacity:1;transform:translate(-50%,0)}
.feat-tag{position:absolute;top:-14px;left:-16px;z-index:6;background:var(--orange);color:#fff;font-family:var(--display);font-size:13px;font-weight:700;padding:7px 14px;border-radius:99px;transform:rotate(-6deg);box-shadow:0 6px 14px -6px #f39a3aaa;transition:.4s}
.feat-nav{position:relative;z-index:2;display:flex;align-items:center;gap:16px;margin-top:34px}
.feat-nav button.ar{width:38px;height:38px;border-radius:50%;border:1px solid #cfd6ee;background:#fff;color:var(--blue);display:grid;place-items:center;transition:.2s}
.feat-nav button.ar:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.feat-nav button.ar svg{width:16px;height:16px}
.dots{display:flex;gap:6px;align-items:center}
.dots button{position:relative;width:8px;height:8px;border-radius:99px;background:#cfd6ee;overflow:hidden;transition:width .4s,background .3s;padding:0}
.dots button.on{width:38px;background:#dfe3f2}
.dots button.on i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:99px}
.feat-cap{position:relative;z-index:2;margin-top:12px;height:22px;line-height:22px;font-size:14px;font-weight:600;color:var(--mut);max-width:min(340px,90%);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-cap b{font-family:var(--display);color:var(--blue);margin-right:8px}

/* ───── shelf ───── */
.shelf-sec{padding:56px 0 100px;position:relative}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.sec-head .k{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.2em;color:var(--blue)}
.sec-head h2{font-size:30px;margin:6px 0 0;letter-spacing:-.02em}
.sec-head h2 b{color:var(--blue)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:0 16px;background:#fff;height:44px;min-width:250px}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px #2361ac1a}
.search svg{width:17px;height:17px;color:var(--mut);flex:none}
.search input{border:0;outline:0;background:none;font:inherit;font-size:14px;width:100%;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 40px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.chip{white-space:nowrap;padding:9px 16px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:500;color:#41475c;background:#fff;transition:.15s}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip small{opacity:.6;margin-left:5px;font-size:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:60px 36px}
.item{display:flex;flex-direction:column;animation:rise .6s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.card{display:block;position:relative}
.card .stand{position:relative;padding:0 6%}
.card .stand::after{content:"";position:absolute;left:-8%;right:-8%;bottom:-14px;height:14px;border-radius:4px;background:linear-gradient(90deg,#dfe4f7,#eef0fb 40%,#e3e0f3);box-shadow:0 10px 16px -8px #4862ad55}
.book{position:relative;aspect-ratio:1/1.396;perspective:1400px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.book .inner{position:absolute;inset:0;border-radius:2px 6px 6px 2px;background:#fff;overflow:hidden;box-shadow:0 1px 1px #0002,0 12px 24px -10px #1a2b5c55,inset 0 0 0 1px #00000010}
.book .inner::after{content:"";position:absolute;top:2%;bottom:2%;right:0;width:5px;z-index:2;background:repeating-linear-gradient(90deg,#e9ecf5 0 1px,#fff 1px 2px)}
.book .inner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.book .inner .lines{position:absolute;inset:14% 12% 14% 22%;background:repeating-linear-gradient(#0000 0 14px,#eceef6 14px 15px)}
.book .inner .lines::before{content:"";position:absolute;left:0;top:-9%;width:55%;height:7px;border-radius:4px;background:var(--blue);opacity:.45}
.book .cv{position:absolute;inset:0;z-index:3;border-radius:3px 7px 7px 3px;overflow:hidden;background:#fff;transform-origin:left center;transition:transform .7s cubic-bezier(.3,.7,.2,1),box-shadow .7s;box-shadow:0 1px 1px #0002,0 12px 24px -10px #1a2b5c66,inset 0 0 0 1px #0000000d;backface-visibility:hidden}
.book .cv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6%;z-index:4;background:linear-gradient(90deg,#00000030,#ffffff40 40%,#00000014 70%,transparent)}
.book .cv::after{content:"";position:absolute;inset:0;z-index:4;background:linear-gradient(115deg,#ffffff30,transparent 40%);pointer-events:none;transition:background .7s}
.book .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;background:#fff}
.card:hover .book,.card:focus-visible .book{transform:translateY(-10px)}
.card:hover .book .cv,.card:focus-visible .book .cv{transform:rotateY(-66deg);box-shadow:18px 10px 34px -8px #1a2b5c44}
.card:hover .book .cv::after{background:linear-gradient(90deg,transparent 30%,#0000002e)}
.go{position:absolute;right:8%;bottom:7%;z-index:3;opacity:0;transition:opacity .3s .25s,transform .3s .25s;transform:translateY(6px)}
.go span{background:var(--blue);color:#fff;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:99px;display:flex;gap:6px;align-items:center;box-shadow:0 6px 14px -4px #2361ac88}
.go svg{width:13px;height:13px}
.card:hover .go,.card:focus-visible .go{opacity:1;transform:none}
.card:focus-visible{outline:none}
.card:focus-visible .book{outline:3px solid var(--orange);outline-offset:6px;border-radius:6px}
.meta{margin-top:30px}
.meta .cat{font-size:12.5px;color:var(--blue);font-weight:700;letter-spacing:.02em}
.meta h3{font-size:18px;line-height:1.4;margin:6px 0 4px;letter-spacing:-.01em}
.meta p{margin:0;font-size:13.5px;color:var(--mut);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-block;background:var(--orange);color:#fff;font-family:var(--display);font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:99px;margin-right:6px;vertical-align:1px}
.ftag{display:inline-block;background:#e8eefb;color:var(--blue);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;margin-right:6px;vertical-align:1px}
.empty{grid-column:1/-1;text-align:center;padding:70px 0;color:var(--mut)}

/* 자동 표지 (표지 이미지가 없을 때) */
.gc{position:absolute;inset:0;container-type:inline-size;color:var(--ink)}
.gc svg{position:absolute;inset:0;width:100%;height:100%}
.gc .y{position:absolute;left:50%;top:15cqw;transform:translateX(-50%);background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;font-size:6.4cqw;padding:1.4cqw 6cqw;border-radius:99px;z-index:2}
.gc .t{position:absolute;left:9cqw;right:9cqw;top:30cqw;text-align:center;z-index:2}
.gc h4{font-size:9.6cqw;line-height:1.28;margin:0;letter-spacing:-.02em;font-weight:800}
.gc .t i{display:block;width:12cqw;height:.6cqw;background:var(--ink);margin:4.5cqw auto 3.5cqw}
.gc small{font-size:5.4cqw;color:var(--mut);display:block;font-weight:500}
.gc .s{position:absolute;left:0;right:0;bottom:6cqw;text-align:center;font-size:5cqw;font-weight:700;z-index:2}

/* ───── footer ───── */
footer{position:relative;background:#0f1a3a;color:#c3c9e0;padding:46px 0;overflow:hidden}
footer::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-80px;top:-160px;background:radial-gradient(circle,#4862ad,#0f1a3a 70%);opacity:.8}
footer .wrap{display:flex;gap:24px;justify-content:space-between;align-items:center;flex-wrap:wrap}
footer .fl{font-size:13px;line-height:1.8}
footer .fl b{color:#fff;font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
footer .fl b i{font-style:normal;font-family:var(--display);font-size:12px;font-weight:800;background:var(--blue);padding:3px 10px;border-radius:99px;letter-spacing:.06em}
footer .links{display:flex;gap:10px;flex-wrap:wrap}
footer .links a{display:flex;align-items:center;gap:8px;border:1px solid #ffffff2a;border-radius:99px;padding:9px 16px;font-size:13px;color:#fff}
footer .links a:hover{background:#ffffff14}
footer .links svg{width:16px;height:16px}

@media (max-width:860px){
  .hero{padding:36px 0 120px}
  .hero .wrap{grid-template-columns:minmax(0,1fr);gap:28px}
  .feat{min-height:440px;order:-1}
  .orb.o{right:6%;top:60px}
  .deco.plus{display:none}
  .search{min-width:0;flex:1}
  .tools{width:100%}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
  .chips::-webkit-scrollbar{display:none}
}
@media (max-width:520px){
  .wrap{width:calc(100% - 32px)}
  .grid{grid-template-columns:1fr 1fr;gap:46px 20px}
  .meta h3{font-size:15.5px}
  .deck{margin-right:30px}
  .dk[data-p="1"]{transform:translate(22px,-14px) rotate(6deg) scale(.93)}
  .dk[data-p="2"]{transform:translate(40px,-26px) rotate(12deg) scale(.86)}
  .sec-head h2{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section class="hero gridbg" id="top">
  <div class="orb b"></div><div class="orb o"></div><div class="orb c"></div>
  <svg class="waves" viewBox="0 0 1440 190" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="w1" x1="0" x2="1"><stop offset="0" stop-color="#2361ac" stop-opacity=".0"/><stop offset=".45" stop-color="#4862ad" stop-opacity=".55"/><stop offset="1" stop-color="#8459a1" stop-opacity=".7"/></linearGradient>
      <linearGradient id="w2" x1="0" x2="1"><stop offset="0" stop-color="#9fdcec" stop-opacity=".1"/><stop offset=".6" stop-color="#9fdcec" stop-opacity=".7"/><stop offset="1" stop-color="#aeb3d9" stop-opacity=".9"/></linearGradient>
      <linearGradient id="w3" x1="0" x2="1"><stop offset="0" stop-color="#aeb3d9" stop-opacity=".2"/><stop offset="1" stop-color="#4862ad" stop-opacity=".9"/></linearGradient>
    </defs>
    <path d="M0 190V150C300 168 640 150 980 96 1180 64 1330 40 1440 20V190Z" fill="url(#w2)"/>
    <path d="M0 190V170C360 178 760 160 1080 116 1250 92 1370 70 1440 56V190Z" fill="url(#w1)"/>
    <path d="M0 190V182C420 184 820 172 1150 140 1300 126 1400 112 1440 104V190Z" fill="#fff"/>
    <path d="M380 176C700 172 980 140 1440 66" stroke="url(#w3)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 160C200 162 330 158 470 150" stroke="#00a8b8" stroke-opacity=".5" stroke-width="6" fill="none" stroke-linecap="round"/>
  </svg>
  <div class="wrap">
    <svg class="deco plus" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4v32M4 20h32" stroke="#00a8b8" stroke-width="8" stroke-linecap="round"/></svg>
    <div>
      <span class="year">2026</span>
      <h1><span class="l1">Edu-Cloud</span><span class="l2">ILSAN</span></h1>
      <div class="rule"></div>
      <div class="sub">일산중학교 교육활동 모음</div>
      <p>일산중학교 선생님과 학생들이 함께 만든 한 해의 교육활동을 e북으로 만나 보세요. 표지를 누르면 e북이 새 창으로 열립니다.</p>
      <div class="cta">
        <a class="btn pri" href="#shelf">책자 둘러보기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a>
        <a class="btn sec" id="mainLink" href="#" target="_blank" rel="noopener">첫 책자부터 보기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
      </div>
    </div>
    <div class="feat" id="feat"></div>
  </div>
</section>

<section class="shelf-sec" id="shelf"><div class="wrap">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</div></section>

<footer id="footer"><div class="wrap">
  <div class="fl" id="footInfo"></div>
  <div class="links" id="footLinks"></div>
</div></footer>

<script>
/* =====================================================================
   ✏️ 학교 정보 — 비워 둔 칸은 사이트에 표시되지 않아요
   ===================================================================== */
const SITE = {
  school: '일산중학교',
  address: '',          // 예) (우편번호) 경기도 고양시 ...
  phone: '',            // 예) 031-000-0000
  homepage: '',         // 학교 홈페이지 주소
  instagram: '',        // 인스타그램 주소 (없으면 비워 두기)
  copyright: 'Copyright © Ilsan Middle School. All rights reserved.',
};

/* =====================================================================
   ✏️ 책자 목록 — 여기만 고치면 됩니다
   - tag     : (선택) 작은 이름표 — 예) '대표 책자'
   - title   : 책자 제목
   - desc    : 한두 줄 소개
   - cat     : 분류 (같은 이름끼리 필터 버튼으로 묶여요)
   - date    : 발간일 'YYYY-MM' (NEW 표시에 사용)
   - link    : 클릭하면 열릴 e북 주소
   - cover   : 표지 이미지 주소 (비워 두면 자동으로 표지를 그려 줘요)
   - inside  : 표지가 열릴 때 보이는 안쪽 페이지 이미지 (선택)
   - featured: true 인 책자부터 상단 대표 책자가 시작돼요
   ※ 사이트에는 이 목록에 적힌 순서대로 보여요
   ※ e북은 ebook/book-01 … 폴더에 있어요 (고양 웹책자와 같은 e북 뷰어, PDF는 pdf/ 폴더)
   ===================================================================== */
const BOOKS = [
  /* ▼ 새 책자는 이 목록에 추가하세요 (위에서부터 순서대로 보여요)
  {title:'책자 제목', desc:'한두 줄 소개', cat:'PART Ⅵ', date:'2026', link:'ebook/book-06/index.html', cover:'covers/cover.jpg', inside:'covers/book-06.jpg'},
  */
  {title:'AI 중점학교', desc:'AI 중점학교 세부 운영계획 · 디지털 시민 주간 · 학교특색활동(AI융합 캠프) 운영 계획', cat:'PART Ⅰ', date:'2026', link:'ebook/book-01/index.html', cover:'covers/cover.jpg', inside:'covers/book-01.jpg', featured:true},
  {title:'AI 서·논술형 평가 실천학교', desc:'AI 서·논술형 평가 실천학교 운영계획서 및 예산사용계획서', cat:'PART Ⅱ', date:'2026', link:'ebook/book-02/index.html', cover:'covers/cover.jpg', inside:'covers/book-02.jpg'},
  {title:'에듀테크 수업관리 솔루션 운영교', desc:'에듀테크 수업관리 솔루션 도입 신청서', cat:'PART Ⅲ', date:'2026', link:'ebook/book-03/index.html', cover:'covers/cover.jpg', inside:'covers/book-03.jpg'},
  {title:'고양 미래교육 실천학교 중심교', desc:'고양미래교육실천학교 운영계획서', cat:'PART Ⅳ', date:'2026', link:'ebook/book-04/index.html', cover:'covers/cover.jpg', inside:'covers/book-04.jpg'},
  {title:'결과보고서 및 지도안', desc:'디지털시민주간·AI융합 캠프·AI 서논술형평가 결과보고, 전학공 수업지도안, 청렴조직문화 우수사례', cat:'PART Ⅴ', date:'2026', link:'ebook/book-05/index.html', cover:'covers/cover.jpg', inside:'covers/book-05.jpg'},
];
/* ✏️ GitHub Pages 주소 — 이 사이트를 올린 주소 (끝에 / 포함)
   GitHub Pages 에서는 e북을 같은 폴더에서 열고, 다른 곳(미리보기 등)에서 볼 때는 이 주소의 e북을 열어요 */
const SITE_URL = 'https://designportmain.github.io/ilsan-ebook/';
const NEW_MONTHS = 3;      // 발간 후 몇 달 동안 NEW 표시
const FEAT_SECONDS = 4;    // 상단 대표 책자가 넘어가는 간격(초)

/* ================================================================== */
const $=s=>document.querySelector(s);
const onSite=location.protocol==='file:'||location.hostname.endsWith('github.io');
const href=l=>(/^(https?:)?\/\//.test(l)||l==='#'||onSite)?l:SITE_URL+l;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ym=d=>{const [y,m]=(d||'0-0').split('-').map(Number);return y*12+(m||1)};
const _now=new Date(), nowYM=_now.getFullYear()*12+_now.getMonth()+1;
const isNew=b=>nowYM-ym(b.date)<NEW_MONTHS;
let state={cat:'전체',q:''};

/* 표지 스타일을 따른 자동 표지: 모눈 배경 + 흐린 원 + 하단 물결 */
function patternSVG(i){
  const id='g'+i, accents=[['#4862ad','#f39a3a'],['#8459a1','#00a8b8'],['#2361ac','#f1ab65'],['#00a8b8','#8459a1']][i%4];
  let grid=''; for(let x=0;x<=100;x+=7) grid+=`<path d="M${x} 0V140"/>`; for(let y=0;y<=140;y+=7) grid+=`<path d="M0 ${y}H100"/>`;
  return `<svg viewBox="0 0 100 140" preserveAspectRatio="xMidYMid slice"><defs>
    <filter id="${id}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="${id}w" x1="0" x2="1"><stop offset="0" stop-color="#9fdcec" stop-opacity=".2"/><stop offset="1" stop-color="${accents[0]}" stop-opacity=".85"/></linearGradient>
    <linearGradient id="${id}v" x1="0" x2="1"><stop offset="0" stop-color="#aeb3d9" stop-opacity=".2"/><stop offset="1" stop-color="#aeb3d9"/></linearGradient></defs>
    <rect width="100" height="140" fill="#fff"/><g stroke="#eef0f6" stroke-width=".4">${grid}</g>
    <circle cx="96" cy="2" r="18" fill="${accents[0]}" filter="url(#${id}b)" opacity=".85"/>
    <circle cx="82" cy="30" r="7" fill="${accents[1]}" filter="url(#${id}b)" opacity=".8"/>
    <path d="M0 140V122C30 126 62 118 100 92V140Z" fill="url(#${id}v)"/>
    <path d="M0 140V130C34 132 70 124 100 104V140Z" fill="url(#${id}w)"/>
    <path d="M0 140V134C40 135 76 130 100 118V140Z" fill="#fff"/>
  </svg>`;
}
function genCover(b,i){
  const [y]=(b.date||'').split('-');
  return `<div class="gc">${patternSVG(i)}<span class="y">${esc(y||'')}</span><div class="t"><h4>${esc(b.title)}</h4><i></i><small>${esc(b.desc)}</small></div><div class="s">${esc(SITE.school)}</div></div>`;
}
function coverHTML(b,i){
  return genCover(b,i)+(b.cover?`<img src="${esc(b.cover)}" alt="${esc(b.title)} 표지" loading="lazy" onerror="this.remove()">`:'');
}

/* 상단 대표 책자 — 카드 덱 */
let featI=0, featTimer=null, featPaused=false, featStart=0, cards=[];
const arrowL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>';
const arrowR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 18 6-6-6-6"/></svg>';
function renderFeatured(){
  if(!BOOKS.length) return;
  $('#feat').innerHTML=`<div class="halo"></div><div class="deck"></div>
    <div class="feat-nav"><button type="button" class="ar fp" aria-label="이전 책자">${arrowL}</button><div class="dots"></div><button type="button" class="ar fn" aria-label="다음 책자">${arrowR}</button></div>
    <div class="feat-cap"></div>`;
  const deck=$('#feat .deck');
  cards=BOOKS.map((b,i)=>{
    const a=document.createElement('a'); a.className='dk'; a.href=href(b.link); a.target='_blank'; a.rel='noopener';
    a.setAttribute('aria-label',b.title+' e북 열기'); a.innerHTML=`<div class="cvw">${coverHTML(b,i)}</div><span class="open">e북 열기 ↗</span>`;
    deck.append(a); return a;
  });
  const tag=document.createElement('span'); tag.className='feat-tag'; deck.append(tag);
  $('#feat .dots').innerHTML=BOOKS.map((_,i)=>`<button type="button" aria-label="${i+1}번째 책자"><i></i></button>`).join('');
  $('#feat .dots').querySelectorAll('button').forEach((d,i)=>d.onclick=()=>{if(i!==featI){showFeat(i,i>featI?1:-1);restartFeat()}});
  $('#feat .fp').onclick=()=>{showFeat(featI-1,-1);restartFeat()};
  $('#feat .fn').onclick=()=>{showFeat(featI+1,1);restartFeat()};
  deck.addEventListener('mouseenter',()=>featPaused=true);
  deck.addEventListener('mouseleave',()=>{featPaused=false;restartFeat()});
  const fi=BOOKS.findIndex(b=>b.featured);
  $('#mainLink').href=href(BOOKS[fi>=0?fi:0].link);
  featI=fi>=0?fi:0; layout(); 
  if(BOOKS.length>1) restartFeat(); else $('#feat .feat-nav').style.display='none';
}
function layout(){
  const n=BOOKS.length;
  cards.forEach((c,i)=>{const d=(i-featI+n)%n; c.dataset.p=d<3?d:'h'; c.tabIndex=d===0?0:-1});
  $('#feat .feat-tag').textContent=String(featI+1).padStart(2,'0')+' ↗';
  $('#feat .dots').querySelectorAll('button').forEach((d,i)=>{d.classList.toggle('on',i===featI);d.querySelector('i').style.width='0'});
  $('#feat .feat-cap').innerHTML=`<b>${String(featI+1).padStart(2,'0')}</b>${esc(BOOKS[featI].title)}`;
}
function showFeat(i,dir){
  const n=BOOKS.length, prev=cards[featI]; featI=(i+n)%n; const next=cards[featI];
  if(dir>0){ prev.classList.add('fly'); setTimeout(()=>prev.classList.remove('fly'),700); layout(); }
  else { next.classList.add('snap','fly'); next.dataset.p='0'; next.offsetWidth; next.classList.remove('snap');
         layout(); requestAnimationFrame(()=>next.classList.remove('fly')); }
}
function restartFeat(){
  cancelAnimationFrame(featTimer); featStart=performance.now();
  let lastP=0;
  const tick=t=>{
    if(featPaused||document.hidden){featStart=t-lastP*FEAT_SECONDS*1000}
    const p=Math.min(1,(t-featStart)/(FEAT_SECONDS*1000)); lastP=p;
    const bar=$('#feat .dots .on i'); if(bar) bar.style.width=(p*100)+'%';
    if(p>=1){showFeat(featI+1,1);featStart=t;lastP=0}
    featTimer=requestAnimationFrame(tick);
  };
  featTimer=requestAnimationFrame(tick);
}

/* 분류 버튼 · 목록 */
function renderChips(){
  const cats=['전체',...new Set(BOOKS.map(b=>b.cat))];
  $('#chips').style.display=cats.length-1<BOOKS.length?'':'none'; // 분류마다 1권뿐이면 버튼 숨김
  $('#chips').innerHTML=cats.map(c=>{const n=c==='전체'?BOOKS.length:BOOKS.filter(b=>b.cat===c).length;
    return `<button class="chip${c===state.cat?' on':''}" data-c="${esc(c)}">${esc(c)}<small>${n}</small></button>`}).join('');
  $('#chips').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{state.cat=el.dataset.c;renderChips();renderGrid()});
}
function bookHTML(b,i){
  const inside=b.inside?`<img src="${esc(b.inside)}" alt="" loading="lazy" onerror="this.remove()">`:'<div class="lines"></div>';
  return `<div class="book">
    <div class="inner">${inside}<div class="go"><span>e북 보기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 17 17 7M8 7h9v9"/></svg></span></div></div>
    <div class="cv">${coverHTML(b,i)}</div>
  </div>`;
}
function renderGrid(){
  const q=state.q.trim().toLowerCase();
  const list=BOOKS.map((b,i)=>({b,i})).filter(({b})=>(state.cat==='전체'||b.cat===state.cat)&&(!q||(b.title+' '+b.desc+' '+b.cat).toLowerCase().includes(q)));
  $('#grid').innerHTML=list.length?list.map(({b,i},k)=>`
    <div class="item" style="animation-delay:${Math.min(k,12)*40}ms"><a class="card" href="${esc(href(b.link))}" target="_blank" rel="noopener" aria-label="${esc(b.title)} e북 열기 (새 창)">
      <div class="stand">${bookHTML(b,i)}</div>
      <div class="meta"><div class="cat">${isNew(b)?'<span class="badge">NEW</span>':''}${b.tag?`<span class="ftag">${esc(b.tag)}</span>`:''}${esc(b.cat)}${b.date?' · '+esc(b.date.replace('-','.')):''}</div><h3>${esc(b.title)}</h3><p>${esc(b.desc)}</p></div>
    </a></div>`).join(''):`<div class="empty">찾는 책자가 없어요. 다른 검색어를 입력해 보세요.</div>`;
}
function renderFooter(){
  const lines=[SITE.address,SITE.phone&&('대표전화 '+SITE.phone),SITE.copyright].filter(Boolean).map(esc).join('<br>');
  $('#footInfo').innerHTML=`<b><i>EDU-CLOUD</i>${esc(SITE.school)}</b>${lines}`;
  const L=[];
  if(SITE.homepage) L.push(`<a href="${esc(SITE.homepage)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>학교 홈페이지</a>`);
  if(SITE.instagram) L.push(`<a href="${esc(SITE.instagram)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg>인스타그램</a>`);
  L.push(`<a href="#top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>맨 위로</a>`);
  $('#footLinks').innerHTML=L.join('');
}
renderFeatured(); renderChips(); renderGrid(); renderFooter();
</script>
</body>
</html>
